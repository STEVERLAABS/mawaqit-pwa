<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>توليد أيقونات PWA</title>
<style>
  body { font-family: Cairo, sans-serif; padding: 20px; background: #f5f5f5; direction: rtl; }
  .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  h1 { color: #03131b; text-align: center; margin-bottom: 20px; }
  .sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin: 20px 0; }
  .size-box { border: 2px dashed #ddd; border-radius: 8px; padding: 15px; text-align: center; background: #fafafa; }
  .size-box canvas { border: 1px solid #ddd; border-radius: 4px; background: white; max-width: 100%; }
  .size-box label { display: block; margin-top: 8px; font-weight: 600; color: #333; }
  button { width: 100%; padding: 15px; background: linear-gradient(135deg, #d9b45a, #b08c3f); color: #03131b; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(217,180,90,.4); }
  .log { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>🕌 توليد أيقونات PWA بأحجام مختلفة</h1>
  <p style="text-align:center;color:#666">اضغط الزر أدناه لتوليد جميع الأحجام المطلوبة وتحميلها تلقائياً</p>
  <div class="sizes" id="sizes"></div>
  <button onclick="generateAll()">توليد وتحميل جميع الأيقونات</button>
  <div class="log" id="log"></div>
</div>

<script>
const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="256" fill="#03131b"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#d9b45a" stroke-width="8" opacity="0.3"/>
  <g fill="#d9b45a">
    <ellipse cx="256" cy="200" rx="80" ry="60"/>
    <path d="M176 200 Q176 140 256 140 Q336 140 336 200 Z" fill="#b08c3f"/>
    <rect x="100" y="180" width="32" height="140" rx="4"/>
    <rect x="380" y="180" width="32" height="140" rx="4"/>
    <polygon points="100,180 116,140 132,180" fill="#d9b45a"/>
    <polygon points="380,180 396,140 412,180" fill="#d9b45a"/>
    <path d="M220 150 Q256 120 292 150 Q256 130 220 150" fill="#03131b"/>
    <path d="M200 240 Q256 300 312 240 L312 260 Q256 310 200 260 Z" fill="#07312a"/>
    <circle cx="256" cy="260" r="18" fill="#03131b"/>
    <rect x="80" y="380" width="352" height="40" rx="8" fill="#07312a"/>
  </g>
  <text x="256" y="450" text-anchor="middle" font-family="Amiri, serif" font-size="48" font-weight="700" fill="#d9b45a">ذكر</text>
</svg>`;

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function createSizeBoxes() {
  const container = document.getElementById('sizes');
  SIZES.forEach(size => {
    const box = document.createElement('div');
    box.className = 'size-box';
    box.innerHTML = `<canvas id="canvas-${size}" width="${size}" height="${size}"></canvas><label>${size}×${size}</label>`;
    container.appendChild(box);
  });
}

function drawIcon(size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const canvas = document.getElementById(`canvas-${size}`);
    const ctx = canvas.getContext('2d');
    canvas.width = size;
    canvas.height = size;
    img.onload = () => {
      ctx.drawImage(img, 0, 0, size, size);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;base64,' + btoa(svgContent);
  });
}

function downloadCanvas(canvas, size) {
  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function generateAll() {
  const btn = document.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'جاري التوليد...';
  log('بدء التوليد...');

  for (const size of SIZES) {
    try {
      log(`توليد ${size}×${size}...`);
      const canvas = await drawIcon(size);
      downloadCanvas(canvas, size);
      log(`✓ تم: icon-${size}.png`);
    } catch (e) {
      log(`✗ خطأ في ${size}: ` + e.message);
    }
  }

  btn.disabled = false;
  btn.textContent = 'تم التوليد — تحقق من مجلد التحميلات';
  log('اكتمل! انقل الملفات المحملة إلى مجلد icons/');
}

createSizeBoxes();
</script>
</body>
</html>
